networks:
  ide-net:
    driver: bridge

volumes:
  uploads_data:
  pg_data:
  geoserver_data:
  backups:

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ide-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ide-net
    depends_on:
      ide-app:
        condition: service_healthy
      ide-geoserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ide-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ide-app
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - uploads_data:/uploads
      - backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ide-net
    depends_on:
      ide-postgis:
        condition: service_healthy
      ide-geoserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  ide-postgis:
    image: postgis/postgis:16-3.4
    container_name: ide-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - backups:/backups
    networks:
      - ide-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ide"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ide-geoserver:
    image: docker.osgeo.org/geoserver:2.25.2
    container_name: ide-geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      SKIP_DEMO_DATA: "true"
      CATALINA_OPTS: >-
        -Xms512m
        -Xmx2048m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
    volumes:
      - geoserver_data:/opt/geoserver_data
    networks:
      - ide-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  ide-gdal:
    image: ghcr.io/osgeo/gdal:ubuntu-full-latest
    container_name: ide-gdal
    restart: unless-stopped
    command: ["sleep", "infinity"]
    volumes:
      - uploads_data:/uploads
      - backups:/backups
    networks:
      - ide-net
    healthcheck:
      test: ["CMD", "gdalinfo", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
